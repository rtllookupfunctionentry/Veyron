[package]
name = "henge-remote"
version = "0.1.0"
edition = "2024"
description = "Shows the Mac that Henge runs on an iPhone, and controls it"
license = "GPL-2.0-or-later"

[features]
# Build SDL3 from source and link it in, where the system has none to offer (Windows, macOS, older Linux).
bundled-sdl = ["sdl3-sys/build-from-source-static"]

[profile.release]
lto = "thin"
strip = true

[dependencies]
dirs = "7.0.0"
egui = "0.36"
egui-phosphor = "0.14.0"
egui_glow = "0.36"
mdns-sd = "0.21.7"
plist = "1.10.3"
sdl3-sys = "0.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[build-dependencies]
cc = "1.11.1"
pkg-config = "0.3.34"
